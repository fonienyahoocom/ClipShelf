name: ClipShelf Windows Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
concurrency:
  group: clipshelf-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Preserve exact source line endings
        shell: pwsh
        run: git config --global core.autocrlf false
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-10-11
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout comparison baseline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.before != '0000000000000000000000000000000000000000' && github.event.before || github.sha }}
          path: .ci-baseline
          persist-credentials: false
      - name: Clear inherited build reports
        shell: pwsh
        run: |
          Get-ChildItem validation -File | Where-Object { $_.Name -in @('tests.log','publish-core.log','publish-wpf.log','installer-build.log','installer-extraction.log','package-checks.log','package-checks.json','payload-manifest.json','commands.json') } | Remove-Item
      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.425
      - name: Verify actual WPF card geometry
        timeout-minutes: 4
        shell: pwsh
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
          DOTNET_NOLOGO: '1'
        run: |
          dotnet build Tests.WpfLayout/Tests.WpfLayout.csproj --configuration Release *> validation/layout-build.log
          $buildCode = $LASTEXITCODE
          Get-Content validation/layout-build.log | Select-Object -Last 40
          if ($buildCode -ne 0) { throw "WPF geometry harness failed to compile" }
          $exe = Join-Path $env:GITHUB_WORKSPACE "Tests.WpfLayout/bin/Release/net8.0-windows/Tests.WpfLayout.exe"
          if (!(Test-Path $exe)) { throw "Built geometry test executable missing" }
          $p = Start-Process -FilePath $exe -WorkingDirectory $env:GITHUB_WORKSPACE -PassThru -NoNewWindow -RedirectStandardOutput "validation/layout-out.log" -RedirectStandardError "validation/layout-err.log"
          if (!$p.WaitForExit(60000)) {
            try { $p.Kill($true) } catch { }
            if (Test-Path validation/layout-stage.log) { Get-Content validation/layout-stage.log }
            throw "Actual WPF geometry timed out after 60 seconds; inspect stage log"
          }
          $code = $p.ExitCode
          if (Test-Path validation/layout-stage.log) { Get-Content validation/layout-stage.log }
          if (Test-Path validation/layout-out.log) { Get-Content validation/layout-out.log | Select-Object -Last 60 }
          if (Test-Path validation/layout-err.log) { Get-Content validation/layout-err.log | Select-Object -Last 30 }
          if ($code -ne 0) { throw "Actual WPF geometry probe failed ($code)" }
      # One-off causal comparison for PR #8 only; remove after collecting evidence.
      - name: Compare old 2.15.8 real WPF geometry
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/grid-two-column-trigger-2.15.9'
        timeout-minutes: 4
        shell: pwsh
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
          DOTNET_NOLOGO: '1'
        run: |
          $old = Join-Path $env:GITHUB_WORKSPACE ".ci-baseline"
          $project = Join-Path $old "Tests.WpfLayout"
          New-Item -ItemType Directory -Path $project -Force | Out-Null
          Copy-Item Tests.WpfLayout/Program.cs "$project/Program.cs" -Force
          Copy-Item Tests.WpfLayout/Tests.WpfLayout.csproj "$project/Tests.WpfLayout.csproj" -Force
          dotnet build "$project/Tests.WpfLayout.csproj" --configuration Release *> validation/layout-old-build.log
          $compile = $LASTEXITCODE
          Get-Content validation/layout-old-build.log | Select-Object -Last 15
          if ($compile -ne 0) { throw "2.15.8 baseline harness compilation failed, comparison unavailable" }
          $exe = Join-Path $project "bin/Release/net8.0-windows/Tests.WpfLayout.exe"
          $p = Start-Process -FilePath $exe -WorkingDirectory $old -PassThru -NoNewWindow -RedirectStandardOutput "$env:GITHUB_WORKSPACE/validation/layout-old-out.log" -RedirectStandardError "$env:GITHUB_WORKSPACE/validation/layout-old-err.log"
          if (!$p.WaitForExit(60000)) { try { $p.Kill($true) } catch { }; throw "2.15.8 test timed out, cannot attribute failure" }
          if (Test-Path "$old/validation/layout-geometry.json") {
            Copy-Item "$old/validation/layout-geometry.json" validation/layout-old-geometry.json -Force
          }
          if ($p.ExitCode -ne 0) {
            Get-Content validation/layout-old-err.log
            throw "2.15.8 baseline did not complete; causal comparison inconclusive"
          }
          $oldJson = Get-Content "$old/validation/layout-geometry.json" -Raw | ConvertFrom-Json
          $newJson = Get-Content validation/layout-geometry.json -Raw | ConvertFrom-Json
          $oldGrid = @($oldJson.evidence | Where-Object { $_.step -eq 'three-short-cards-wide' })[0]
          $newGrid = @($newJson.evidence | Where-Object { $_.step -eq 'three-short-cards-wide' })[0]
          if (!$oldGrid -or !$newGrid) { throw "Missing actual WPF grid geometry" }
          $difference = [math]::Abs([double]$oldGrid.cardBounds[1].x - [double]$newGrid.cardBounds[1].x)
          if ($difference -gt 1) { throw "Old/new geometry unexpectedly differs; inspect both JSON logs" }
          Write-Host "CAUSAL FALSIFICATION: both unmodified 2.15.8 and candidate 2.15.9 produce true two-column cards"
          Write-Host "old second card X=$($oldGrid.cardBounds[1].x); candidate second card X=$($newGrid.cardBounds[1].x); difference=$difference"
          Write-Host "The bool/string mismatch is NOT demonstrated as the user's root cause."
      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install package inspection and NSIS
        shell: pwsh
        run: |
          python -m pip install pefile==2024.8.26
          if ($LASTEXITCODE -ne 0) { throw 'pefile install failed' }
          choco install nsis --version=3.11 -y --no-progress
          if ($LASTEXITCODE -notin 0,3010) { throw 'NSIS install failed' }
          ./.ci/Install-NsisAmd64.ps1 -NsisDirectory (Join-Path ${env:ProgramFiles(x86)} 'NSIS') -SevenZip (Join-Path $env:ProgramFiles '7-Zip\7z.exe')
      - name: Tests, publish, installer and byte verification
        shell: pwsh
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
          DOTNET_NOLOGO: '1'
        run: |
          $nsis = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
          $sevenzip = Join-Path $env:ProgramFiles '7-Zip\7z.exe'
          if (!(Test-Path $nsis) -or !(Test-Path $sevenzip)) { throw 'Required packaging tool missing' }
          $baseline = "$env:GITHUB_WORKSPACE\.ci-baseline"
          if (!(Test-Path "$baseline\ClipShelf\HistoryStore.cs")) {
            python CI_BASELINE.py
            if ($LASTEXITCODE -ne 0) { throw 'Initial baseline hash verification failed' }
            $baseline = "$env:GITHUB_WORKSPACE\.ci-initial-baseline"
          }
          python BUILD_PORTABLE.py --baseline $baseline --output "$env:GITHUB_WORKSPACE\out" --dotnet (Get-Command dotnet).Source --makensis $nsis --sevenzip $sevenzip
          if ($LASTEXITCODE -ne 0) { throw 'Build or verification failed' }
          python CI_RELEASE.py
          if ($LASTEXITCODE -ne 0) { throw 'Release report failed' }
      - name: Upload checked release
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: clipshelf-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            out/ClipShelf-*-Source.zip
            out/ClipShelf-*-Setup.exe
            out/ClipShelf-*-BuildReceipt.json
            out/ClipShelf-*-版本交付清單.json
            out/ClipShelf-*-更新說明與測試結果.md
            out/ClipShelf-*-使用說明.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Upload validation logs even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: clipshelf-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            validation/*.log
            validation/package-checks.json
            validation/commands.json
          if-no-files-found: warn
          retention-days: 7
